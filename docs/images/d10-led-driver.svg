<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <rect width="1000" height="650" fill="white"/>
  <g font-family="sans-serif" font-size="18" fill="#172b40">
    <text x="25" y="38" font-size="24">Backlight PWM: high-side +5 V switch with 3.3 V level shifting</text>
    <text x="25" y="70">Concept circuit; select rated parts and verify package S/G/D pinouts before assembly.</text>
    <g stroke="#172b40" stroke-width="3" fill="none">
      <path d="M650 100 V175 M650 245 V290 H875 V365 M650 145 H455 V192"/>
      <rect x="435" y="192" width="40" height="65"/>
      <path d="M455 257 V315 H570 V210 H610 M455 315 H385 V335"/>
      <rect x="365" y="335" width="40" height="55"/>
      <path d="M385 390 V375 H290 V395 M290 462 V545 H875 V465"/>
      <path d="M45 425 H150 M220 425 H250 M235 425 V472"/>
      <rect x="150" y="409" width="70" height="32"/>
      <rect x="215" y="472" width="40" height="50"/>
      <path d="M235 522 V545 M875 425 V465"/>
      <rect x="805" y="365" width="140" height="60"/>
      <rect x="610" y="175" width="80" height="70"/>
      <rect x="250" y="395" width="80" height="67"/>
    </g>
    <text x="620" y="204">Q1</text><text x="620" y="230">P-MOS</text>
    <text x="665" y="167">S</text><text x="665" y="268">D</text><text x="580" y="202">G</text>
    <text x="660" y="120">Fused/current-limited +5 V</text>
    <text x="490" y="230">47 kΩ</text>
    <text x="35" y="400">Teensy GPIO 9</text>
    <text x="154" y="460">100 Ω</text>
    <text x="145" y="503">100 kΩ</text>
    <text x="260" y="418">Q2</text><text x="257" y="448">N-MOS</text>
    <text x="298" y="388">D</text><text x="298" y="484">S</text><text x="233" y="412">G</text>
    <text x="405" y="370">1 kΩ</text>
    <text x="700" y="315">J1-8: switched +5 V</text>
    <text x="816" y="389">PCB resistors</text><text x="816" y="413">+ LEDs</text>
    <text x="705" y="522">J1-6 LED ground</text>
    <text x="300" y="573">Common ground: supply −, Teensy GND, J1-6 and Q2 source</text>
    <text x="25" y="609" font-size="16">GPIO HIGH → Q2 on → Q1 gate pulled down → LEDs on. GPIO LOW / reset → LEDs off.</text>
    <text x="25" y="634" font-size="16">Q1: rated at VGS = −4.5 V; Q2: adequate conduction at 3.3 V. No +5 V path to GPIO.</text>
  </g>
</svg>
